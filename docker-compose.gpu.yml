# Hands the assistant's model server an NVIDIA GPU. An override, merged onto
# docker-compose.yml by service name — everything else stays as written there:
#
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# or, to keep typing plain `docker compose ...`, one line in the .env next to
# these files (the separator is `:` in a Linux/WSL shell, `;` on Windows):
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#
# It is kept out of the main file because a GPU reservation makes `up` fail on a
# machine whose Docker has no NVIDIA runtime. The host needs an NVIDIA driver and
# the NVIDIA Container Toolkit (see the README). Ollama picks the GPU up by itself
# — the platform cannot tell the difference, apart from the speed.

services:
    ollama:
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
