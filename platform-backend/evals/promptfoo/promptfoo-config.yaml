# The AI assistant's eval suite, run by Promptfoo (`npm run eval` from
# platform-backend/). Each provider entry is the whole agent on one model
# (`promptfoo-agent-provider.ts`); the tests are the eval cases
# (`promptfoo-tests-from-tool-choice-cases.ts`); every row is scored by
# `assert-tool-choice.ts` (the calls it made) and `assert-reply-expectation.ts`
# (what its reply says). Results: providers across, cases down.
# `file://` paths are relative to this file.
description: YCP assistant — tool choice and reply, by model

prompts:
    - '{{prompt}}'

providers:
    - id: file://promptfoo-agent-provider.ts
      label: qwen3 4B instruct
      config:
          llm: ollama
          model: qwen3:4b-instruct-2507-q4_K_M

tests: file://promptfoo-tests-from-tool-choice-cases.ts

defaultTest:
    options:
        # A case's earlier turns are an array; without this, Promptfoo would
        # fan the array out into one test per element.
        disableVarExpansion: true
    assert:
        - type: javascript
          value: file://assert-tool-choice.ts
        - type: javascript
          value: file://assert-reply-expectation.ts
        # A model-graded judge is one more entry here, no code change: every
        # row carries its case's rubric (or the default one) in the `rubric`
        # var. A hosted grader, not a local one — the GPU holds one model —
        # with its API key read from the environment, e.g.:
        #   - type: llm-rubric
        #     value: '{{rubric}}'
        #     provider: anthropic:messages:<model>

evaluateOptions:
    # One GPU: two models loading at once would only queue inside Ollama and
    # trip the client's idle watchdog.
    maxConcurrency: 1
    # No pause between cases. For a while there was one (30 s), while
    # continuous inference seemed to freeze the WSL distro; the cause was
    # llama-server's prompt cache filling the VM's RAM, switched off with
    # LLAMA_ARG_CACHE_RAM=0 on the Ollama service (the evals notes in
    # CLAUDE.md tell the story). `--delay <ms>` on the command line brings a
    # pause back for one run.

# After every run, `record-eval-run-results.ts` folds the run into
# ../results/<model>.json (one merged file per model) and regenerates
# ../results/README.md.
# The suffix is the hook name; Promptfoo also looks the export up by it.
extensions:
    - file://record-eval-run-results.ts:afterAll
