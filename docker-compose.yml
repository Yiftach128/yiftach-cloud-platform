# Runs the whole app next to the Docker daemon it manages:
#
#     docker compose up -d --build
#
# then open http://localhost:3000. Day-to-day development stays on `npm run dev`
# (see the README) — a code change here means an image rebuild.
#
# This file carries only the wiring (ports, the socket mounts, where the services
# find each other); each image's own defaults live in its Dockerfile.
#
# As written here the assistant's model runs on the CPU, so `up` works on any
# machine. With an NVIDIA GPU, one line in the .env hands it over:
# OLLAMA_RUNTIME=nvidia (see the ollama service below).

name: ycp

# What more than one service below has to agree on, written once: the Ollama image
# (pinned — the platform's Ollama client was verified against this version's wire
# format) and the model the assistant runs on. OLLAMA_MODEL in a .env next to this
# file swaps the model for the platform and the pull together.
x-ollama-image: &ollama-image ollama/ollama:0.34.2
x-ollama-model: &ollama-model ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}

services:
    # The API and the UI on one origin.
    platform:
        build: .
        restart: unless-stopped
        ports:
            # Loopback only, on purpose: the API has no login and controls Docker.
            # YCP_PORT moves the host port when 3000 is taken (a .env next to this
            # file works: YCP_PORT=3080).
            - "127.0.0.1:${YCP_PORT:-3000}:3000"
        environment:
            # Hosts a request may name (Host/Origin); anything else gets 403. `platform`
            # is this service's name — the builder below reaches it as platform:3000.
            ALLOWED_HOSTS: localhost,127.0.0.1,platform
            # The model server below, by its service name. Deliberately no depends_on:
            # the platform starts and serves everything else with Ollama down, and a
            # chat then ends with an error event that says so.
            OLLAMA_URL: http://ollama:11434
            OLLAMA_MODEL: *ollama-model
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s

    # A build agent in its own container, so cloning an unverified repository never
    # touches the platform's filesystem. No published ports — it only polls the
    # platform. Two replicas by default, each reporting under its own container
    # hostname; `--scale builder=N` overrides the count for one `up`.
    builder:
        build: ./builder-service-backend
        restart: unless-stopped
        deploy:
            replicas: 2
        environment:
            PLATFORM_API_URL: http://platform:3000/api/v1
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            platform:
                condition: service_healthy

    # The assistant's model server. No published ports — only the platform talks to
    # it, as ollama:11434 — so it never collides with an Ollama installed on the
    # host. The image ships without models; they live in a named volume, which
    # survives `down` and image updates.
    ollama:
        image: *ollama-image
        # The container runtime for the model server. Empty — the default — means
        # the daemon's own default (runc): the model runs on the CPU and `up` works
        # on any machine. OLLAMA_RUNTIME=nvidia in the .env picks the runtime the
        # NVIDIA Container Toolkit registers next to Docker (in WSL: inside the
        # distro), which hands the container every GPU on the host — the image's own
        # NVIDIA_VISIBLE_DEVICES=all asks for them. Without the toolkit that runtime
        # is unknown and `up` fails, which is why it is opt-in. A runtime rather than
        # a device reservation (deploy.resources.reservations.devices) on purpose:
        # Compose interpolates scalars only, so a reservation — a block — could not
        # be switched off per machine and needed an override file of its own.
        runtime: ${OLLAMA_RUNTIME:-}
        restart: unless-stopped
        volumes:
            - ollama-models:/root/.ollama
        healthcheck:
            # The image has no wget or curl; the CLI asking its own server is the probe.
            test: ["CMD", "ollama", "list"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s

    # Downloads the assistant's model into the volume, then exits — the image's
    # entrypoint is the `ollama` CLI, pointed at the server above instead of starting
    # its own. A few GB on the first `up` (`docker compose logs -f ollama-model-pull`
    # shows the progress; until it is done a chat answers "model not found"); on
    # every later `up` the model is already there and this finishes in a moment.
    ollama-model-pull:
        image: *ollama-image
        restart: "no"
        environment:
            OLLAMA_HOST: http://ollama:11434
        command: ["pull", *ollama-model]
        depends_on:
            ollama:
                condition: service_healthy

volumes:
    ollama-models:
